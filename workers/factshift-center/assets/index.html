<!DOCTYPE html>
<html lang="en"
      itemscope
      itemtype="https://schema.org/WebApplication"
      data-app="factshift"
      data-app-version="0.0.2-alpha">
<head>
    <meta charset="UTF-8">
    <title>&lt;concept&gt;</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="Factshift — a 7-dimensional force simulation environment for conceptual sketching with Spw syntax">
    <meta itemprop="name" content="Factshift">
    <meta itemprop="description" content="7D force simulation with Spw command language">
    <link rel="icon" href="/v0.0.1/favicon/16.png">
    <link rel="manifest" href="/manifest.json">
  <script type="module" crossorigin src="/assets/main-WobsIdag.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index-uSS_7k5P.js">
  <link rel="stylesheet" crossorigin href="/assets/index-VV3KTSkL.css">
  <link rel="stylesheet" crossorigin href="/assets/main-_qtzgt2L.css">
</head>
<body data-mode="nothing"
      data-interface-depth="standard"
      data-spw-feature="mode-navigation">

<!-- ── header: title + wonder ─────────────────────────────────── -->
<header role="banner" data-region="header">
    <button id="main-wonder-button"
            aria-label="Open wonder prompt"
            data-action="wonder">?</button>
    <h1 itemprop="name">&lt;concept&gt;</h1>
    <a id="title-md5" tabindex="-1" aria-hidden="true"></a>
</header>

<!-- ── simulation canvas ──────────────────────────────────────── -->
<main role="main" data-region="canvas">
    <div id="content" data-role="simulation-viewport">
        <svg id="simulation"
             role="group"
             aria-label="Force simulation canvas">
            <g class="simulation-content" data-layer="scene">
                <g class="simulation-rects" data-layer="rects" aria-hidden="true"></g>
                <g class="simulation-edges" data-layer="edges" aria-hidden="true"></g>
                <g class="simulation-nodes" data-layer="nodes"></g>
            </g>
        </svg>
    </div>
</main>

<!-- ── event log ──────────────────────────────────────────────── -->
<aside id="main-log" role="log" aria-label="Event log" data-region="log">
    <ul class="events-log" aria-live="polite"></ul>
</aside>

<!-- ── media container ────────────────────────────────────────── -->
<aside id="main-image-container"
       role="complementary"
       aria-label="Media preview"
       data-region="media"></aside>

<!-- ── websocket integration ──────────────────────────────────── -->
<section id="main-websocket-container"
         role="complementary"
         aria-label="WebSocket connection"
         data-region="websocket">
    <spwashi-websocket-container></spwashi-websocket-container>
</section>

<!-- ── focal controls ─────────────────────────────────────────── -->
<nav role="toolbar"
     aria-label="Focal controls"
     data-region="focal">
    <button id="focal-square"
            type="button"
            data-focal-status="active"
            data-spw-feature="mode-navigation"
            aria-label="Open menu. Drag to move the mark."
            title="Open menu. Drag moves the mark.">
        <span id="focal-mark" aria-hidden="true">◎</span>
    </button>
    <div id="tool-lens"
         tabindex="0"
         role="group"
         aria-label="Lens: arrows choose, Enter toggles the tool"
         hidden></div>
    <output id="tool-indicator"
            aria-label="Active tool"
            data-role="tool-indicator"></output>
    <div id="tool-palette" role="toolbar" aria-label="Superpower tools" data-role="tool-palette"></div>
    <button id="ws-toggle"
            aria-label="Toggle WebSocket panel"
            data-action="toggle-ws"
            title="Toggle WebSocket panel">ws</button>
</nav>

<!-- ── mode panels ────────────────────────────────────────────── -->
<aside id="mode-container"
       aria-label="Mode panels"
       data-region="modes"
       data-spw-feature="mode-navigation">
    <section id="spw-mode-container" data-mode-panel="spw">
        <div id="spw-container" data-role="spw-input">
            <div class="spw-field">
                <label>
                    <span data-role="spw-form">spw</span>
                    <textarea id="spw-parse-field"
                              aria-label="Spw expression input"></textarea>
                </label>
                <button type="button"
                        data-action="clear-spw-prompt"
                        title="Empty the prompt"
                        hidden>clear</button>
            </div>
            <p id="spw-reading" data-role="spw-reading" aria-label="What the line meets"></p>
            <div data-role="spw-actions">
                <button id="parse-spw"
                        type="button"
                        data-action="parse-spw"
                        title="Run Spw input (Cmd/Ctrl+Enter)">run</button>
            </div>
            <output id="spw-prime-context"
                    aria-live="polite"
                    data-role="spw-prime-context"></output>
            <output id="spw-selection-context"
                    aria-live="polite"
                    data-role="spw-selection-context"></output>
            <output id="spw-prompt-status"
                    aria-live="polite"
                    data-role="spw-prompt-status"></output>
            <p data-role="spw-hint">Cmd/Ctrl+Enter: run · Esc: focal mark</p>
        </div>
    </section>
    <section id="story-mode-container" data-mode-panel="story">
        <div class="action-group"></div>
    </section>
    <section id="map-mode-container" data-mode-panel="map">
        <div id="node-mapper" class="code-editor" data-role="node-mapper"></div>
        <button id="submit-node-mapper" data-action="submit-mapper">submit</button>
    </section>
    <section id="filter-mode-container" data-mode-panel="filter">
        <div id="node-filter" class="code-editor" data-role="node-filter"></div>
        <button id="submit-node-filter" data-action="submit-filter">submit</button>
    </section>
    <section id="querymod-mode-container" data-mode-panel="query">
        <div id="query-parameters" data-role="query-input">
            <label>
                <span>Query Parameters</span>
                <textarea class="query-value"
                          aria-label="Query parameters input"></textarea>
            </label>
            <button class="query-submit" data-action="submit-query">go</button>
        </div>
    </section>
    <section id="node-mode-container" data-mode-panel="node">
        <!-- The node tool: names to add, the canvas, what this browser keeps,
             and the motion. It stays open; the line at the foot says what the
             last press did (node-panel.ts). -->
        <div id="node-panel" data-role="node-panel">
            <div id="controls" data-role="simulation-controls">
                <!-- By intent, top to bottom: make nodes, keep them, how the
                     canvas feels, and its motion by the thumb. -->
                <section class="card" data-group="make">
                    <header class="card-header">make</header>
                    <div class="card-body" id="node-input-container" data-role="node-input">
                        <input id="nodes-input"
                               aria-label="Names for new nodes, or nodes as JSON"
                               placeholder="seed sprout root"
                               autocomplete="off" autocapitalize="off" spellcheck="false"/>
                        <div class="action-group" data-group="node-input">
                            <button class="add" data-action="add-nodes">add</button>
                            <button class="replace" data-action="replace-nodes">replace</button>
                            <button class="generate-nodes" data-action="generate-nodes">more</button>
                        </div>
                    </div>
                </section>
                <section class="card" data-group="data">
                    <header class="card-header">keep <span class="node-panel-state" data-role="save-state"></span></header>
                    <div class="card-body action-group" data-group="data-actions">
                        <button class="save-nodes" data-action="save-nodes">save</button>
                        <button class="read-nodes" data-action="read-nodes">load</button>
                        <button class="clear-saved-nodes" data-action="clear-nodes">empty</button>
                    </div>
                </section>
                <section class="card" data-group="feel">
                    <header class="card-header">feel <button type="button" class="node-feel-toggle" aria-pressed="false" title="Show each feel as the parameter it sets">parameters</button></header>
                    <!-- Each row a choice of feels; the physics behind them is
                         in physics-params.ts. -->
                    <div class="card-body node-feels">
                        <div class="node-feel" data-param="repel"><span>spacing</span><div class="action-group"></div></div>
                        <div class="node-feel" data-param="drag"><span>flow</span><div class="action-group"></div></div>
                        <div class="node-feel" data-param="centering"><span>gather</span><div class="action-group"></div></div>
                        <div class="node-feel" data-param="link-pull"><span>ties</span><div class="action-group"></div></div>
                    </div>
                </section>
                <section class="card" data-group="simulation">
                    <header class="card-header">move <span class="node-panel-state" data-role="motion-state"></span></header>
                    <div class="card-body action-group" data-group="simulation-actions">
                        <button class="play" data-action="sim-play" aria-pressed="true">pause</button>
                        <button class="tick" data-action="sim-tick">step</button>
                        <button class="reinit" data-action="sim-reinit">restart</button>
                        <button class="clear-fixed-positions" data-action="free-positions">loose</button>
                    </div>
                </section>
            </div>
            <output data-role="node-said" aria-live="polite"></output>
        </div>
    </section>
    <section id="color-mode-container" data-mode-panel="color">
        <div id="colors" role="group" aria-label="Color palette">
            <button data-dataindex="spwashi-datum-0" class="color-swatch color-swatch--0" aria-label="Color 0"></button>
            <button data-dataindex="spwashi-datum-1" class="color-swatch color-swatch--1" aria-label="Color 1"></button>
            <button data-dataindex="spwashi-datum-2" class="color-swatch color-swatch--2" aria-label="Color 2"></button>
            <button data-dataindex="spwashi-datum-3" class="color-swatch color-swatch--3" aria-label="Color 3"></button>
            <button data-dataindex="spwashi-datum-4" class="color-swatch color-swatch--4" aria-label="Color 4"></button>
            <button data-dataindex="spwashi-datum-5" class="color-swatch color-swatch--5" aria-label="Color 5"></button>
            <button data-dataindex="spwashi-datum-6" class="color-swatch color-swatch--6" aria-label="Color 6"></button>
            <button data-dataindex="spwashi-datum-7" class="color-swatch color-swatch--7" aria-label="Color 7"></button>
            <button data-dataindex="spwashi-datum-8" class="color-swatch color-swatch--8" aria-label="Color 8"></button>
            <button data-dataindex="spwashi-datum-9" class="color-swatch color-swatch--9" aria-label="Color 9"></button>
            <button data-dataindex="spwashi-datum-10" class="color-swatch color-swatch--10" aria-label="Color 10"></button>
            <button data-dataindex="spwashi-datum-11" class="color-swatch color-swatch--11" aria-label="Color 11"></button>
            <button data-dataindex="spwashi-datum-12" class="color-swatch color-swatch--12" aria-label="Color 12"></button>
        </div>
    </section>
    <section id="reflex-mode-container" data-mode-panel="reflex">
        <div id="reflexes" role="group" aria-label="Reflex actions"></div>
    </section>
    <section id="debug-mode-container" data-mode-panel="debug">
        <section data-role="debug-output">
            <output id="output" aria-label="Debug output"></output>
        </section>
    </section>
</aside>

<!-- ── navigation: mode shortcuts + hotkeys ───────────────────── -->
<nav id="mainmenu-shortcuts"
     role="navigation"
     aria-label="Mode menu"
     data-region="shortcuts"
     data-spw-feature="mode-navigation">
    <button id="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="mode-menu"
            data-action="toggle-menu">Menu</button>
    <ol id="mode-menu" role="list"></ol>
</nav>
<aside id="held-expressions" aria-label="Expressions on the canvas" hidden><ol></ol></aside>
<button id="hotkey-menu-toggle"
        type="button"
        aria-label="Open shortcuts"
        aria-expanded="false"
        data-action="toggle-hotkeys"
        data-spw-feature="mode-navigation">[...]</button>
<nav id="hotkey-container"
     role="navigation"
     aria-label="Keyboard shortcuts"
     data-interface-element="hotkey-menu"
     data-region="hotkeys"
     data-spw-feature="mode-navigation">
    <ul id="keystroke-options" role="list" aria-label="Available shortcuts"></ul>
</nav>
</body>
</html>

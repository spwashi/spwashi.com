<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed. The finder and its controls fit inside the center safe circle.
       Render at 180, 192 and 512 with rsvg-convert; use 512 for the maskable icon. -->
  <defs>
    <radialGradient id="body" cx="25%" cy="12%" r="95%">
      <stop stop-color="#4c3055"/>
      <stop offset="1" stop-color="#140e18"/>
    </radialGradient>
    <linearGradient id="glass" x2="0" y2="1">
      <stop stop-color="#674472"/>
      <stop offset=".49" stop-color="#392944"/>
      <stop offset=".51" stop-color="#281d33"/>
      <stop offset="1" stop-color="#1c1527"/>
    </linearGradient>
    <linearGradient id="metal" x2=".5" y2="1">
      <stop stop-color="#fff2ff"/>
      <stop offset="1" stop-color="#ad91bc"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#body)"/>
  <rect x="96" y="142" width="320" height="221" rx="32" fill="#140e18"/>
  <rect x="106" y="132" width="300" height="218" rx="23" fill="url(#glass)" stroke="url(#metal)" stroke-width="8"/>
  <path d="M206 144v194m100-194v194M118 205h276m-276 73h276" stroke="#c5a8d2" opacity=".28" stroke-width="3"/>
  <circle cx="303" cy="223" r="32" fill="none" stroke="#d9ff61" stroke-width="8"/>
  <path d="M179 390h154" stroke="#b5a2c3" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="390" r="10" fill="#d9ff61"/>
</svg>

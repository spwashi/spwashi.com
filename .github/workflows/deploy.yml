name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc incremental state and input-hash stamps. A stale entry is safe: a pass
      # whose inputs changed misses its stamp and runs. Test stamps are not cached,
      # so the module suite always runs here.
      - name: Restore compile stamps
        uses: actions/cache@v4
        with:
          path: .tmp/tsc
          key: tsc-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-

      - name: Validate source and generated contracts
        run: npm run check:local

      - name: Build and validate deploy artifact
        run: npm run build:site:run

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

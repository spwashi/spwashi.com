name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts and engagement tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # tsc incremental state and input-hash stamps. A stale entry is safe: a pass
      # whose inputs changed misses its stamp and runs. Test stamps are not cached,
      # so the module suite always runs here.
      - uses: actions/cache@v4
        with:
          path: .tmp/tsc
          key: tsc-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-
      - run: npm run check:local

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run smoke:nav -- --routes /,/settings/,/topics/software/ --settle-ms 4000

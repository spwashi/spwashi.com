name: Drift notice

# Deploy publishes dist/ after check:local on a clean checkout. This workflow
# is the notice for everything that check does not cover and that should not
# stop Pages. Each job writes a short receipt. The last job assembles
# notice.json: smoke reasons, the plan index, citation verdicts, high
# advisories, the day's subjects, and the pocket attention receipt.
# The receipt is about-opening plus the UTC day's still and state. The roster
# starts on the 1st and walks one non-home still a day. Days 7, 14, 21, and 28
# also keep that week's climate still. Home stays out.
# Smoke keeps five core routes and adds that day's route. Dark and
# high-contrast add a query. Other states stay on the still.
# Readings use a closed vocabulary. A missed prepare is step-not-landed.
# A light model reads that file. It follows the commit Deploy just judged,
# and runs again each morning so a day with no push still gets a look.
# The morning run also builds dist/ and loads every catalog module from it.
# built-modules.yml does the same on a push that changes the bundle's shape.
#
# Between runs a ledger (drift-notice.mjs, kept in the Actions cache) holds
# what is open. A still or a route that failed is carried into the next runs
# until it passes, so the rotation cannot turn it green. Each open failure is
# new or standing. Advisories and pending worker deploys (worker-drift.mjs)
# are decisions: listed apart, never red. Sunday's run takes every still of
# the month, so a broken check shows within a week, not on its one day. The
# notice is also written to the run's summary, which reads without a login.
on:
  schedule:
    - cron: '17 9 * * *'
    # Sunday: every still of the month.
    - cron: '47 9 * * 0'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'drift-notice-deploy' || 'drift-notice-scheduled' }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Browser smoke
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Open failures from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: drift-ledger.json
          key: drift-ledger-${{ github.run_id }}
          restore-keys: drift-ledger-
      - name: Require settled browser smoke with clean console and layout
        run: |
          set -o pipefail
          base=$(node --input-type=module -e "
            import { nightlyMonthReceipt } from './scripts/lib/visual-capture-plan.mjs';
            const receipt = nightlyMonthReceipt(new Date().getUTCDate());
            process.stdout.write(receipt.smoke.routes.join(','));
          ")
          # A route that failed stays in until it passes.
          routes=$(node scripts/drift-notice.mjs carry --ledger drift-ledger.json --job smoke --base "${base}")
          echo "routes=${routes}"
          npm run smoke:nav:ci -- --routes "${routes}" --receipt smoke-receipt.json | tee smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-smoke
          path: |
            smoke.txt
            smoke-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  attention:
    name: Pocket attention
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.schedule == '47 9 * * 0' && 45 || 12 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Open failures from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: drift-ledger.json
          key: drift-ledger-${{ github.run_id }}
          restore-keys: drift-ledger-
      - name: Record the month day
        env:
          WHOLE_MONTH: ${{ github.event.schedule == '47 9 * * 0' && '1' || '' }}
        run: |
          node --input-type=module -e "
            import { mkdirSync, writeFileSync, readFileSync, existsSync } from 'node:fs';
            import { nightlyMonthReceipt } from './scripts/lib/visual-capture-plan.mjs';
            import { carryList } from './scripts/drift-notice.mjs';
            const receipt = nightlyMonthReceipt(new Date().getUTCDate());
            // Sunday takes every still of the month; other days take the day's,
            // plus any still that failed and has not passed since.
            const whole = process.env.WHOLE_MONTH === '1';
            const base = whole
              ? [...new Set(Array.from({ length: 31 }, (_, i) => nightlyMonthReceipt(i + 1).ids).flat())]
              : receipt.ids;
            const ledger = existsSync('drift-ledger.json') ? JSON.parse(readFileSync('drift-ledger.json', 'utf8')) : null;
            const ids = carryList(ledger, 'attention', base);
            const carried = ids.filter((id) => !base.includes(id));
            const ran = { ...receipt, ids, carried, whole };
            mkdirSync('drift-attention', { recursive: true });
            writeFileSync('drift-attention/month-receipt.json', JSON.stringify(ran, null, 2) + '\n');
            writeFileSync('drift-attention/ids.txt', ids.join(','));
            process.stdout.write('day=' + receipt.day + ' week=' + receipt.week + ' state=' + receipt.state + ' route=' + receipt.route + (whole ? ' whole-month' : '') + ' ids=' + ids.join(',') + (carried.length ? ' carried=' + carried.join(',') : '') + '\n' + receipt.reading + '\n');
          "
      - name: About opening plus the day's month still
        run: |
          ids=$(cat drift-attention/ids.txt)
          echo "ids=${ids}"
          node scripts/component-snapshots.mjs --stills --checks --viewports pocket --ids "${ids}" --out drift-attention
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-attention
          path: |
            drift-attention/attention-receipt.json
            drift-attention/month-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  citations:
    name: Plan index and .spw citations
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .spw/_workbench/package-lock.json
      - run: npm ci
      - run: npm ci --prefix .spw/_workbench --ignore-scripts
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Plan directory indexes
        run: npm run plans:index:check -- --receipt plan-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-plans
          path: plan-receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Every .spw citation resolves
        if: always()
        run: |
          set +e
          npm run spw:integrity -- --json > citations.json
          status=$?
          node scripts/drift-notice.mjs citations < citations.json > citations-receipt.json || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-citations
          path: citations-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependency audit
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Registry audit
        # A decision, not drift: the notice lists advisories (new ones marked)
        # and the run stays green on them. Fixes wait on the creator's review.
        run: |
          set +e
          npm audit --json --audit-level=moderate > audit.json
          node scripts/drift-notice.mjs audit < audit.json > audit-receipt.json || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-audit
          path: audit-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  built-modules:
    name: Built site modules
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Build the deploy artifact
        run: npm run build
      - name: Every catalog module loads from dist
        run: npm run check:built -- --receipt built-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-built
          path: built-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  notice:
    name: Notice
    needs: [browser-smoke, citations, dependencies, attention, built-modules]
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: receipts
      - name: Open failures from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: drift-ledger.json
          key: drift-ledger-${{ github.run_id }}
          restore-keys: drift-ledger-
      - name: Day's subjects
        run: git log --since='24 hours ago' --format='%h %s' > subjects.txt
      - name: Worker deploys
        run: node scripts/worker-drift.mjs --receipt workers-receipt.json || true
      - name: Assemble notice.json
        run: |
          node scripts/drift-notice.mjs assemble \
            --sha "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --out notice.json \
            --ledger drift-ledger.json \
            --ledger-out drift-ledger.json \
            --summary notice.md \
            --workers workers-receipt.json \
            --smoke receipts/drift-smoke/smoke-receipt.json \
            --plans receipts/drift-plans/plan-receipt.json \
            --citations receipts/drift-citations/citations-receipt.json \
            --audit receipts/drift-audit/audit-receipt.json \
            --attention receipts/drift-attention/attention-receipt.json \
            --month receipts/drift-attention/month-receipt.json \
            --built receipts/drift-built/built-receipt.json \
            --subjects subjects.txt
          cat notice.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the open failures for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: drift-ledger.json
          key: drift-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-notice
          path: |
            notice.json
            notice.md
            drift-ledger.json
          if-no-files-found: ignore
          retention-days: 14

name: Drift notice

# Deploy publishes dist/ after check:local on a clean checkout. This workflow
# is the notice for everything that check does not cover and that should not
# stop Pages: a real browser, the plan index, .spw citations, and the
# dependency audit. It follows the commit Deploy just judged, and runs again
# each morning so a day with no push still gets a look.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'drift-notice-deploy' || 'drift-notice-scheduled' }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Browser smoke
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Require settled browser smoke with clean console and layout
        run: |
          set -o pipefail
          npm run smoke:nav:ci -- --routes /,/settings/,/topics/software/,/tools/spw-parser/,/about/ | tee smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: smoke.txt
          retention-days: 14

  citations:
    name: Plan index and .spw citations
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .spw/_workbench/package-lock.json
      - run: npm ci
      - run: npm ci --prefix .spw/_workbench --ignore-scripts
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Plan directory indexes
        run: npm run plans:index:check
      - name: Every .spw citation resolves
        if: always()
        run: npm run spw:integrity

  dependencies:
    name: Dependency audit
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Registry audit
        run: npm run audit

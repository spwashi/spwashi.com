name: Drift notice

# Deploy publishes dist/ after check:local on a clean checkout. This workflow
# is the notice for everything that check does not cover and that should not
# stop Pages. Each job writes a short receipt. The last job assembles
# notice.json: smoke reasons, the plan index, citation verdicts, high
# advisories, the day's subjects, and the pocket attention receipt.
# The receipt is about-opening plus one climate still, rotating by UTC day:
# dark, curriculum focus, the software frame probe, folio with motion reduced.
# Passes keep opacity, charge, and resonance.
# A light model reads that file. It follows the commit Deploy just judged,
# and runs again each morning so a day with no push still gets a look.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'drift-notice-deploy' || 'drift-notice-scheduled' }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Browser smoke
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Require settled browser smoke with clean console and layout
        run: |
          set -o pipefail
          npm run smoke:nav:ci -- --routes /,/settings/,/topics/software/,/tools/spw-parser/,/about/ --receipt smoke-receipt.json | tee smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-smoke
          path: |
            smoke.txt
            smoke-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  attention:
    name: Pocket attention
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: About opening plus one climate still
        run: |
          climate=$(node --input-type=module -e "
            import { nightlyClimateId } from './scripts/lib/visual-capture-plan.mjs';
            const start = Date.UTC(new Date().getUTCFullYear(), 0, 0);
            const day = Math.floor((Date.now() - start) / 86400000);
            process.stdout.write(nightlyClimateId(day));
          ")
          echo "climate=${climate}"
          node scripts/component-snapshots.mjs --stills --checks --viewports pocket --ids "about-opening,${climate}" --out drift-attention
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-attention
          path: drift-attention/attention-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  citations:
    name: Plan index and .spw citations
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .spw/_workbench/package-lock.json
      - run: npm ci
      - run: npm ci --prefix .spw/_workbench --ignore-scripts
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Plan directory indexes
        run: npm run plans:index:check -- --receipt plan-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-plans
          path: plan-receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Every .spw citation resolves
        if: always()
        run: |
          set +e
          npm run spw:integrity -- --json > citations.json
          status=$?
          node scripts/drift-notice.mjs citations < citations.json > citations-receipt.json || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-citations
          path: citations-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependency audit
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Commit under test
        run: git rev-parse HEAD && git log -1 --oneline
      - name: Registry audit
        run: |
          set +e
          npm audit --json --audit-level=moderate > audit.json
          status=$?
          node scripts/drift-notice.mjs audit < audit.json > audit-receipt.json || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-audit
          path: audit-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  notice:
    name: Notice
    needs: [browser-smoke, citations, dependencies, attention]
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 80
      - uses: actions/download-artifact@v4
        with:
          path: receipts
      - name: Day's subjects
        run: git log --since='24 hours ago' --format='%h %s' > subjects.txt
      - name: Assemble notice.json
        run: |
          node scripts/drift-notice.mjs assemble \
            --sha "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --out notice.json \
            --smoke receipts/drift-smoke/smoke-receipt.json \
            --plans receipts/drift-plans/plan-receipt.json \
            --citations receipts/drift-citations/citations-receipt.json \
            --audit receipts/drift-audit/audit-receipt.json \
            --attention receipts/drift-attention/attention-receipt.json \
            --subjects subjects.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-notice
          path: notice.json
          if-no-files-found: ignore
          retention-days: 14
